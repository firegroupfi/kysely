#vk{--bg:#000;--panel:#1e1e1e;--panel2:#111;--line:rgba(136,136,136,.75);--ink:#fff;--muted:#bdbdbd;--fire:#f05a0e;--ember:rgba(119,52,23,.25);--ember-solid:#672d14;--green:#0cce25;--coral:#d84b3d;
 background:var(--bg);color:var(--ink);font-family:"KyselyMontserrat","One Montserrat","Montserrat","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.6;padding:24px 16px 56px;text-align:left;position:relative}
#vk *,#vk *::before,#vk *::after{box-sizing:border-box}
#vk .vk-wrap{max-width:720px;margin:0 auto}
#vk h1,#vk h2,#vk h3,#vk p,#vk ul,#vk fieldset,#vk legend{margin:0;padding:0;border:0;font-family:inherit;text-transform:none;letter-spacing:normal}
#vk h1{font-size:clamp(34px,7vw,52px);line-height:1.1;font-weight:700;color:var(--fire);margin-bottom:20px}
#vk h2{font-size:clamp(24px,4.6vw,32px);line-height:1.2;font-weight:700;color:var(--fire);margin-bottom:12px}
#vk h3{font-size:19px;line-height:1.3;font-weight:600;color:var(--ink);margin-bottom:6px}
#vk p{margin-bottom:14px;color:var(--ink)}
#vk .vk-muted{color:var(--muted);font-size:15px}
#vk .vk-lead{font-size:19px;color:var(--ink)}
#vk .vk-bar{height:4px;background:#2b2b2b;border-radius:2px;margin:0 0 8px;overflow:hidden}
#vk .vk-bar i{display:block;height:100%;width:0;background:var(--fire);transition:width .35s ease}
#vk .vk-stepno{font-size:14px;color:var(--muted);margin-bottom:28px}
#vk fieldset.vk-q{margin:0 0 34px;min-width:0}
#vk fieldset.vk-q[hidden]{display:none}
#vk legend{display:block;width:100%;font-size:19px;font-weight:600;line-height:1.4;margin-bottom:6px;padding:0;color:var(--ink)}
#vk .vk-help{font-size:15px;color:var(--muted);margin:0 0 14px}
#vk .vk-opts{display:grid;gap:10px;margin-top:12px}
#vk .vk-opt{position:relative;display:block}
#vk .vk-opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
#vk .vk-opt span{display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 16px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:16px;line-height:1.4;cursor:pointer}
#vk .vk-opt span::before{content:"";flex:0 0 20px;height:20px;border:2px solid var(--muted);border-radius:50%}
#vk .vk-multi .vk-opt span::before{border-radius:4px}
#vk .vk-opt input:checked+span{border-color:var(--fire);background:var(--ember-solid)}
#vk .vk-opt input:checked+span::before{border-color:var(--fire);background:var(--fire);box-shadow:inset 0 0 0 3px var(--ember-solid)}
#vk .vk-opt input:focus-visible+span{outline:3px solid var(--fire);outline-offset:2px}
#vk .vk-opt input:disabled+span{opacity:.5;cursor:not-allowed}
#vk .vk-opt.vk-no span{border-style:dashed}
#vk .vk-words{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
#vk .vk-words .vk-opt span{min-height:44px;padding:8px 16px;border-radius:999px;font-size:15px}
#vk .vk-words .vk-opt span::before{display:none}
#vk .vk-words .vk-opt input:checked+span{background:var(--fire);color:#000;border-color:var(--fire);font-weight:700}
#vk .vk-count{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0;margin:10px 0 0;font-weight:600;color:var(--muted);font-size:15px}
#vk .vk-count b{color:var(--fire);font-size:22px}
#vk .vk-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
#vk .vk-scale .vk-opt span{justify-content:center;padding:12px 4px;font-weight:700;font-size:18px}
#vk .vk-scale .vk-opt span::before{display:none}
#vk .vk-ends{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);margin-top:8px}

  ];

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function visible(step){ return step.intro || !step.showIf || step.showIf(); }
  function visSteps(){ return STEPS.filter(function(s){ return visible(s) && !s.intro; }); }

  function qHtml(q){
    var h = '<fieldset class="vk-q" data-q="'+q.id+'"><legend>'+(q.labelHtml||esc(q.label))+'</legend>';
    if(q.help) h += '<p class="vk-help">'+esc(q.help)+'</p>';
    if(q.type==='single' || q.type==='multi'){
      h += '<div class="vk-opts '+(q.type==='multi'?'vk-multi':'')+'">';
      q.options.forEach(function(o,i){
        h += '<label class="vk-opt'+(o.no?' vk-no':'')+'"><input type="'+(q.type==='multi'?'checkbox':'radio')+'" name="'+q.id+'" value="'+esc(o.v)+'" data-x="'+(o.x?1:0)+'" data-g="'+(o.g||0)+'"><span>'+o.t+'</span></label>';
      });
      h += '</div>';
    } else if(q.type==='scale'){
      h += '<div class="vk-scale">';
      for(var i=1;i<=5;i++) h += '<label class="vk-opt"><input type="radio" name="'+q.id+'" value="'+i+'" aria-label="'+i+' / 5"><span>'+i+'</span></label>';
      h += '</div><div class="vk-ends"><span>'+esc(q.left)+'</span><span>'+esc(q.right)+'</span></div>';
    } else if(q.type==='words'){
      h += '<div class="vk-count" aria-live="polite">Valittu <b>0</b> / enint\u00e4\u00e4n 5</div><div class="vk-words">';
      var wopts = q.optionsFn ? q.optionsFn().map(function(w){return {v:w,t:w};}) : q.options;
      shuffled(q.id+(q.optionsFn && S.taloyhtio==='kylla' ? '_T':''), wopts).forEach(function(o){
        h += '<label class="vk-opt"><input type="checkbox" name="'+q.id+'" value="'+esc(o.v)+'"><span>'+esc(o.t)+'</span></label>';
      });
      h += '</div>';
    }
    h += '<p class="vk-err" role="alert"></p></fieldset>';
    return h;
  }

  function limitOf(q){ return q.type==='words' ? 5 : (q.max || 99); }

  function syncQ(fs, q){
    var inputs = fs.querySelectorAll('input');
    var vals = [];
    inputs.forEach(function(inp){ if(inp.checked) vals.push(inp.value); });
    if(q.type==='single' || q.type==='scale') S[q.id] = vals.length ? vals[0] : undefined;
    else S[q.id] = vals;
    if(q.type==='multi' || q.type==='words'){
      var lim = limitOf(q);
      var excl = fs.querySelector('input[data-x="1"]:checked');
      inputs.forEach(function(inp){
        if(excl) inp.disabled = (inp !== excl);
        else inp.disabled = !inp.checked && vals.length >= lim;
      });
      var c = fs.querySelector('.vk-count b'); if(c) c.textContent = vals.length;
    }
  }

  function restore(fs, q){
    var v = S[q.id];
    fs.querySelectorAll('input').forEach(function(inp){
      if(Array.isArray(v)) inp.checked = v.indexOf(inp.value) > -1;
      else inp.checked = (v !== undefined && inp.value === String(v));
    });
    syncQ(fs, q);
  }

  function refreshCond(step){
    step.qs.forEach(function(q){
      var fs = app.querySelector('[data-q="'+q.id+'"]');
      if(!fs) return;
      var show = !q.showIf || q.showIf();
      fs.hidden = !show;
      if(!show){ delete S[q.id]; }
    });
  }

  function render(i){
    cur = i;
    var step = STEPS[i];
    var vs = visSteps();
    window.scrollTo && root.scrollIntoView({block:'start'});
    if(step.intro){
      head.hidden = true;
      app.innerHTML =
        '<h1>'+esc(TITLE)+'</h1>'+
        '<p class="vk-lead">Kyselyn tekee FireGroup. Kyselyn pituus on noin viisi minuuttia.</p>'+
        '<p>Tutkimme, kuinka kiinnostuneita ihmiset ovat uudenlaiseen tapaan ajatella varautumista ja kriisist\u00e4 selviytymist\u00e4 kotona sek\u00e4 taloyhti\u00f6iss\u00e4. Tuotteet ovat viel\u00e4 suunnitteilla, ja vastauksesi auttavat meit\u00e4 rakentamaan niist\u00e4 sellaisia, joita oikeasti tarvitaan.</p>'+
        '<h3 style="margin-top:26px">Mist\u00e4 on kyse?</h3>'+
        '<ol class="vk-pts">'+
          '<li><b>Varautuminen alkaa kotoa</b>S\u00e4hk\u00f6- tai vesikatko, verkkojen h\u00e4iri\u00f6 tai muu kriisi voi tulla nopeasti. Varautuminen tarkoittaa, ett\u00e4 tied\u00e4t etuk\u00e4teen, mit\u00e4 tehd\u00e4 ja mit\u00e4 kotona kannattaa olla.</li>'+
          '<li><b>Mit\u00e4 varautumisen tuotteilla tarkoitetaan</b>Tuotteet ovat verkossa teht\u00e4vi\u00e4 kokonaisuuksia, verkkokursseja tai verkkoperehdytyksi\u00e4. Ne tuovat tiedon yhteen paikkaan ja kertovat asiat ymm\u00e4rrett\u00e4v\u00e4sti ja perusteellisesti.</li>'+
          '<li><b>Kolme tuotetta</b>Varautumisen aloittamispaketti kokoaa perusasiat. Koti kriisiss\u00e4 syvent\u00e4\u00e4 valmiutta omaan kotiin. Taloyhti\u00f6 kriisiss\u00e4 on tarkoitettu taloyhti\u00f6n vastuuhenkil\u00f6ille. Esittelemme ne kyselyss\u00e4 lyhyesti.</li>'+
          '<li><b>Ilmaista tietoa on, mutta se on hajallaan</b>Viranomaisten oppaat ovat hy\u00f6dyllisi\u00e4. Haluamme selvitt\u00e4\u00e4, kaipaatko niiden lis\u00e4ksi selke\u00e4\u00e4, sinua varten rakennettua kokonaisuutta.</li>'+
          '<li><b>Vastauksesi ratkaisevat</b>Kysymme kiinnostuksestasi, sopivasta hinnasta ja siit\u00e4, millaista sis\u00e4lt\u00f6\u00e4 haluat. Et osta mit\u00e4\u00e4n, eik\u00e4 vastaaminen sido sinua mihink\u00e4\u00e4n.</li>'+
        '</ol>'+
        '<p>Vastaukset tallennetaan nimett\u00f6min\u00e4.</p>'+
        '<h3 style="margin-top:22px">Arvonta</h3>'+
        '<p>Kyselyn lopussa voit osallistua PREOX-sammutuspeitteen ja kahvipaketin arvontaan j\u00e4tt\u00e4m\u00e4ll\u00e4 s\u00e4hk\u00f6postiosoitteesi. S\u00e4hk\u00f6postia ei voida linkitt\u00e4\u00e4 vastausvaihtoehtoihin. Arvonta suoritetaan joulukuussa 2026, ja voittajiin otetaan yhteytt\u00e4 s\u00e4hk\u00f6postitse palkinnon lunastamiseksi.</p>'+
        '<div class="vk-nav"><button type="button" class="vk-start">Aloita kysely</button></div>';
      app.querySelector('.vk-start').onclick = function(){ render(next(i)); };
      return;
    }
    head.hidden = false;
    var idx = vs.indexOf(step);
    barI.style.width = Math.round((idx/(vs.length))*100)+'%';
    head.querySelector('.vk-bar').setAttribute('aria-valuenow', Math.round((idx/vs.length)*100));
    stepNo.textContent = 'Vaihe '+(idx+1)+' / '+vs.length;
    var h = step.card ? '' : '<h2>'+esc(step.title)+'</h2>';
    if(step.html) h += step.html;
    if(step.card) h += '<div class="vk-card">'+step.card+'</div>';
    step.qs.forEach(function(q){ h += qHtml(q); });
    h += '<div class="vk-nav">';
    if(idx>0) h += '<button type="button" class="vk-ghost vk-back">Takaisin</button>';
    if(step.last) h += '<button type="button" class="vk-next vk-send">L\u00e4het\u00e4 vastaukset</button>';
    else h += '<button type="button" class="vk-next">Seuraava</button>';
    if(step.optional) h += '<button type="button" class="vk-ghost vk-skip">Ohita t\u00e4m\u00e4 osio</button>';
    h += '<button type="button" class="vk-abort">Keskeyt\u00e4</button>';
    h += '</div><p class="vk-err vk-rerr" role="alert"></p>';
    app.innerHTML = h;

    step.qs.forEach(function(q){
      var fs = app.querySelector('[data-q="'+q.id+'"]');
      restore(fs, q);
      fs.addEventListener('change', function(ev){
        var t = ev.target;
        if(q.type==='multi' && t.checked){
          var isExcl = t.getAttribute('data-x')==='1';
          var g = t.getAttribute('data-g');
          fs.querySelectorAll('input').forEach(function(o){
            if(o===t) return;
            if(isExcl) o.checked = false;
            else if(g && g!=='0' && o.getAttribute('data-g')===g) o.checked = false;
          });
        }
        syncQ(fs, q);
        fs.querySelector('.vk-err').textContent = '';
        if(q.id==='taloyhtio') TOUCHED = true;
        if(q.id==='asumismuoto' && !TOUCHED){
          var dflt = S.asumismuoto==='omakotitalo' ? 'ei' : ((S.asumismuoto==='rivitalo' || S.asumismuoto==='kerrostalo') ? 'kylla' : null);
          var q2 = step.qs.filter(function(x){ return x.id==='taloyhtio'; })[0];
          var fs2 = app.querySelector('[data-q="taloyhtio"]');
          if(dflt && q2 && fs2){
            fs2.querySelectorAll('input').forEach(function(inp){ inp.checked = (inp.value===dflt); });
            syncQ(fs2, q2);
            fs2.querySelector('.vk-err').textContent = '';
          }
        }
        refreshCond(step);
      });
    });
    refreshCond(step);

    var back = app.querySelector('.vk-back');
    if(back) back.onclick = function(){ render(prev(i)); };
    var skip = app.querySelector('.vk-skip');
    if(skip) skip.onclick = function(){
      step.qs.forEach(function(q){ delete S[q.id]; });
      S[step.id+'_ohitettu'] = true;
      render(next(i));
    };
    app.querySelector('.vk-abort').onclick = abort;
    app.querySelector('.vk-next').onclick = function(){
      if(!validate(step)) return;
      if(step.last) submit(); else render(next(i));
    };
  }

  function next(i){ var j=i+1; while(j<STEPS.length && !visible(STEPS[j])) j++; return j; }
  function prev(i){ var j=i-1; while(j>0 && !visible(STEPS[j])) j--; return j; }

  function validate(step){
    var ok = true, first = null;
    step.qs.forEach(function(q){
      var fs = app.querySelector('[data-q="'+q.id+'"]');
      if(fs.hidden) return;
      var v = S[q.id], msg = '';
      if(q.type==='words'){ if(!v || v.length<1) msg = 'Valitse v\u00e4hint\u00e4\u00e4n yksi sana.'; }
      else if(q.type==='multi'){
        var min = q.min || 1;
        if(q.groupReq){
          var gv = q.options.filter(function(o){return o.g===1;}).map(function(o){return o.v;});
          if(!v || !v.some(function(x){return gv.indexOf(x)>-1;})) msg = 'Valitse vuokralainen tai osakas.';
        }
        if(!msg && (!v || v.length < min)) msg = min>1 ? 'Valitse '+min+' vaihtoehtoa.' : 'Valitse v\u00e4hint\u00e4\u00e4n yksi vaihtoehto.';
      } else if(v===undefined){ msg = 'Valitse yksi vaihtoehto jatkaaksesi.'; }
      fs.querySelector('.vk-err').textContent = msg;
      if(msg){ ok = false; if(!first) first = fs; }
    });
    if(first) first.scrollIntoView({block:'center'});
    return ok;
  }

  function postJson(obj){
    return fetch(ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(obj)}).catch(function(){});
  }

  function submit(){
    app.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
    var main = app.querySelector('.vk-next'); main.textContent = 'Tallennetaan\u2026';
    var rec = {
      id: Math.random().toString(36).slice(2,10) + Date.now().toString(36),
      ts: new Date().toISOString(),
      kesto_s: Math.round((Date.now()-t0)/1000),
      lahde: (new URLSearchParams(location.search).get('lahde')||''),
      laite: (window.innerWidth<700?'mobiili':'tietokone'),
      vastaukset: S
    };
    var botti = hp.value !== '';
    if(botti){ thanks(); return; }
    if(!ENDPOINT){ try{ console.log('VASTAUS (ei l\u00e4hetetty, ENDPOINT puuttuu):', JSON.stringify(rec)); }catch(e){} thanks(); return; }
    var finished = false;
    function fin(){ if(!finished){ finished = true; thanks(); } }
    var timer = setTimeout(fin, 8000);
    postJson(rec).then(function(){ clearTimeout(timer); fin(); });
  }

  function abort(){
    S = {}; ORDER = {}; TOUCHED = false;
    head.hidden = true;
    app.innerHTML =
      '<h2>Kiitos, ett\u00e4 aloitit kyselyn!</h2>'+
      '<p class="vk-lead">Vastauksiasi ei tallennettu. Toivomme, ett\u00e4 ehdit vastata my\u00f6hemmin uudelleen. Kysely on avoinna samassa osoitteessa.</p>'+
      '<div class="vk-nav"><button type="button" class="vk-restart">Aloita alusta</button></div>'+
      FG_BLOCK;
    app.querySelector('.vk-restart').onclick = function(){ t0 = Date.now(); render(0); };
    root.scrollIntoView({block:'start'});
  }

  var FG_BLOCK = '<div class="vk-org"><h3>FireGroup</h3><p>FireGroup on lappeenrantalainen palo- ja pelastusturvallisuusalan yritys, joka tarjoaa sammutuspeitteit\u00e4 ja paloturvallisuustuotteita sek\u00e4 konsultointi- ja koulutuspalveluita.</p><p class="vk-muted"><a href="https://firegroup.fi" target="_blank" rel="noopener">firegroup.fi</a> \u00b7 info@firegroup.fi</p></div>';

  function thanks(){
    head.hidden = true;
    app.innerHTML =
      '<h2 class="vk-ok" style="color:var(--green)">Kiitos osallistumisesta!</h2>'+
      '<p class="vk-lead">Vastauksesi on tallennettu nimett\u00f6m\u00e4n\u00e4. Ne auttavat meit\u00e4 p\u00e4\u00e4tt\u00e4m\u00e4\u00e4n, mit\u00e4 kannattaa tehd\u00e4 ja mill\u00e4 hinnalla.</p>'+
      '<div class="vk-raffle" id="vk-raffle">'+
        '<h3>Haluatko viel\u00e4 osallistua arvontaan?</h3>'+
        '<p>Arvomme PREOX-sammutuspeitteen ja kahvipaketin. Osallistuminen on vapaaehtoista. Arvonta suoritetaan joulukuussa 2026, ja voittajiin otetaan yhteytt\u00e4 s\u00e4hk\u00f6postitse.</p>'+
        '<label class="vk-lbl" for="vk-email">S\u00e4hk\u00f6postiosoite</label>'+
        '<input type="email" id="vk-email" class="vk-email" autocomplete="email" inputmode="email" maxlength="120">'+
        '<div class="vk-opts vk-multi"><label class="vk-opt"><input type="checkbox" id="vk-consent"><span>Hyv\u00e4ksyn, ett\u00e4 osoitettani k\u00e4ytet\u00e4\u00e4n vain arvonnan voittajille ilmoittamiseen.</span></label></div>'+
        '<p class="vk-err vk-rerr" role="alert"></p>'+
        '<div class="vk-nav"><button type="button" class="vk-send vk-draw">Osallistu arvontaan</button></div>'+
        '<p class="vk-muted" style="margin-top:14px">S\u00e4hk\u00f6postiosoite tallennetaan erilleen vastauksistasi, eik\u00e4 sit\u00e4 yhdistet\u00e4 niihin. Osoite poistetaan arvonnan j\u00e4lkeen. Rekisterinpit\u00e4j\u00e4: FireGroup, Lappeenranta, info@firegroup.fi.</p>'+
      '</div>'+
      '<h3 style="margin-top:28px">Kolme asiaa, jotka kannattaa tehd\u00e4 heti</h3>'+
      '<div class="vk-tip"><p><b>Varaa juomavett\u00e4.</b> Ihminen tarvitsee p\u00e4ivitt\u00e4in noin 2 litraa puhdasta juomavett\u00e4, ja lis\u00e4ksi vett\u00e4 tarvitaan ruoanlaittoon ja hygieniaan.</p></div>'+
      '<div class="vk-tip"><p><b>Hanki paristoilla toimiva radio ja varaparistot.</b> Vaaratiedote annetaan muun muassa radiossa.</p></div>'+
      '<div class="vk-tip"><p><b>Kokoa kotivara.</b> Pullovett\u00e4, helposti valmistettavaa ruokaa, v\u00e4h\u00e4n k\u00e4teist\u00e4 ja omat l\u00e4\u00e4kkeet. Tavoitteena on p\u00e4rj\u00e4t\u00e4 v\u00e4hint\u00e4\u00e4n 72 tuntia.</p></div>'+
      FG_BLOCK;
    var box = document.getElementById('vk-raffle');
    var rerr = box.querySelector('.vk-rerr');
    box.querySelector('.vk-draw').onclick = function(){
      var em = document.getElementById('vk-email').value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ rerr.textContent = 'Tarkista s\u00e4hk\u00f6postiosoite.'; return; }
      if(!document.getElementById('vk-consent').checked){ rerr.textContent = 'Hyv\u00e4ksy ensin osoitteen k\u00e4ytt\u00f6 arvontaa varten.'; return; }
      var b = box.querySelector('.vk-draw'); b.disabled = true; b.textContent = 'Tallennetaan\u2026';
      function ready(){ box.innerHTML = '<h3 class="vk-ok" style="color:var(--green)">Olet mukana arvonnassa!</h3><p>Kiitos! Otamme voittajiin yhteytt\u00e4 s\u00e4hk\u00f6postitse joulukuussa 2026.</p>'; }
      if(hp.value !== ''){ ready(); return; }
      if(!ENDPOINT){ try{ console.log('ARVONTA (ei l\u00e4hetetty, ENDPOINT puuttuu)'); }catch(e){} ready(); return; }
      /* Osoite l\u00e4hetet\u00e4\u00e4n erikseen ilman tunnistetta tai aikaleimaa, jotta sit\u00e4 ei voi yhdist\u00e4\u00e4 vastauksiin. */
      var done = false; function fin(){ if(!done){ done = true; ready(); } }
      var t = setTimeout(fin, 8000);
      postJson({tyyppi:'arvonta', email: em}).then(function(){ clearTimeout(t); fin(); });
    };
    root.scrollIntoView({block:'start'});
  }

  render(0);
})();
</script>
</div>

</body>
</html>
